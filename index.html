<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A retro arcade quiz that teaches online safety to ages 8-18.">
<title>Cyber Defender Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="color:#fff;font-family:monospace;padding:1rem">Please enable JavaScript to play.</p></noscript>
<main>
<h1>CYBER DEFENDER</h1>
<div class="sub">★ ARCADE QUIZ ★</div>

<section id="start" class="box">
  <button class="snd" id="snd" aria-pressed="true">SOUND: ON</button>
  <h2>INSERT COIN</h2>
  <label for="nm">PLAYER NAME</label>
  <input id="nm" maxlength="10" placeholder="ENTER NAME" autocomplete="off">
  <div class="lbl">CHOOSE YOUR LEVEL</div>
  <div class="row" id="ages"></div>
  <button class="go" id="play">▶ PLAY</button>
  <div class="msg" id="smsg" aria-live="polite"></div>
</section>

<section id="game" class="box hide">
  <div class="hud"><span id="qn"></span><span id="tm"></span><span id="sc"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <p class="q" id="q" aria-live="polite"></p>
  <div class="ans" id="ans"></div>
  <div class="msg" id="gmsg" aria-live="polite"></div>
  <div class="why" id="why"></div>
  <button class="go" id="nxt" style="display:none">NEXT ▶</button>
</section>

<section id="end" class="box hide">
  <h2>GAME OVER</h2>
  <div class="big" id="final"></div>
  <div class="rank" id="rank"></div>
  <div class="msg" id="emsg" style="text-align:center" aria-live="polite"></div>
  <button class="go" id="share" style="background:var(--cyan);border-color:var(--cyan)">⇪ SHARE SCORE</button>
  <button class="go" id="again">▶ PLAY AGAIN</button>
</section>

<section class="box">
  <h2>★ HIGH SCORES ★</h2>
  <div class="row" id="tabs" style="margin-bottom:12px"></div>
  <table><thead><tr><th>#</th><th>NAME</th><th>LVL</th><th>SCORE</th></tr></thead><tbody id="lb"></tbody></table>
  <div class="note" id="lbnote"></div>
</section>
</main>

<script src="script.js"></script>
</body>
</html>

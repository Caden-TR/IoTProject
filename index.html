<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0221">
<meta name="description" content="A retro arcade quiz that teaches online safety to ages 8-18.">
<title>Cyber Defender Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<noscript><p style="padding:1rem">Please enable JavaScript to play.</p></noscript>
<main>
<header>
  <h1>🛡️ CYBER DEFENDER</h1>
  <div class="sub">★ ARCADE QUIZ ★</div>
  <div class="tools">
    <button id="snd" aria-pressed="true">🔊 SOUND ON</button>
    <button id="big" aria-pressed="false">A+ BIG TEXT</button>
    <span id="pad" class="hide">🎮 CONTROLLER</span>
  </div>
</header>

<section id="start" class="box">
  <h2>1 · PLAYER</h2>
  <label for="nm">NAME</label>
  <input id="nm" maxlength="10" placeholder="ENTER NAME" autocomplete="off">
  <div class="lbl">AVATAR</div>
  <div class="row av" id="avs"></div>
  <h2 class="gap">2 · LEVEL</h2>
  <div class="row" id="ages"></div>
  <h2 class="gap">3 · GAME MODE</h2>
  <div class="modes" id="modes"></div>
  <button class="go" id="play">▶ PLAY</button>
  <div class="msg" id="smsg" aria-live="polite"></div>
  <p class="note">KEYS: 1-4 ANSWER · ARROWS MOVE · ENTER SELECT · ESC QUIT</p>
  <p class="note padhint">PAD: D-PAD MOVE · A SELECT · START PLAY · A/B/X/Y ANSWER · LB 50:50 · RB READ · SELECT QUIT</p>
</section>

<section id="game" class="box hide">
  <div class="hud"><span id="qn"></span><span id="lv"></span><span id="tm"></span><span id="sc"></span></div>
  <div class="bar"><i id="fill"></i></div>
  <p class="q" id="q" aria-live="polite"></p>
  <div class="ans" id="ans"></div>
  <div class="tools2">
    <button id="fifty">50:50</button>
    <button id="say">🔊 READ</button>
    <button id="quit">✖ QUIT</button>
  </div>
  <div class="msg" id="gmsg" aria-live="polite"></div>
  <div class="why" id="why"></div>
  <button class="go hide" id="nxt">NEXT ▶</button>
</section>

<section id="end" class="box hide">
  <h2>GAME OVER</h2>
  <div class="big" id="final"></div>
  <div class="rank" id="rank"></div>
  <div class="rank sm" id="pbline"></div>
  <div class="rank gold" id="newb"></div>
  <div class="msg" id="emsg" style="text-align:center" aria-live="polite"></div>
  <button class="go alt" id="share">⇪ SHARE SCORE</button>
  <button class="go" id="again">▶ PLAY AGAIN</button>
</section>

<section class="box">
  <h2>★ BADGES ★</h2>
  <div class="badges" id="badges"></div>
</section>

<section class="box">
  <h2>★ HIGH SCORES ★</h2>
  <div class="row" id="tabs"></div>
  <div class="row" id="mtabs" style="margin:8px 0 12px"></div>
  <table><thead><tr><th>#</th><th>PLAYER</th><th>SCORE</th></tr></thead><tbody id="lb"></tbody></table>
  <div class="note" id="lbnote"></div>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
